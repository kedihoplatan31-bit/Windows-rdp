name: X2Go Ubuntu Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-22.04

    steps:
      - name: Install desktop + x2go
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies x2goserver x2goserver-xsession openssh-server

      - name: Create user
        run: |
          if ! id x2gouser >/dev/null 2>&1; then
            sudo useradd -m x2gouser
          fi
          echo "x2gouser:123456" | sudo chpasswd
          sudo usermod -aG sudo x2gouser

      - name: Enable SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Setup Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TS_KEY }} --ssh

      - name: Show connection info
        run: |
          echo "===== CONNECT INFO ====="
          tailscale ip -4
          echo "User: x2gouser"
          echo "Pass: 123456"
          echo "Session: XFCE"
