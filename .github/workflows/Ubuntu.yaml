name: Ubuntu X2Go Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Update system
        run: |
          sudo apt update

      - name: Install desktop (XFCE)
        run: |
          sudo apt install -y xfce4 xfce4-goodies dbus-x11

      - name: Install X2Go Server
        run: |
          sudo apt install -y x2goserver x2goserver-xsession

      - name: Create user
        run: |
          sudo useradd -m x2gouser
          echo "x2gouser:123456" | sudo chpasswd
          sudo usermod -aG sudo x2gouser

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --hostname=github-ubuntu

      - name: Show Tailscale IP
        run: |
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Keep alive (6 hours)
        run: sleep 21600
