name: Windows NoMachine RDP

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Disable Sleep
      run: |
        powercfg /change standby-timeout-ac 0
        powercfg /change hibernate-timeout-ac 0

    - name: Download NoMachine
      run: |
        curl -L -o nomachine.exe https://download.nomachine.com/download/8.11/Windows/nomachine_8.11.3_4_x64.exe

    - name: Install NoMachine
      run: |
        Start-Process nomachine.exe -ArgumentList "/S" -Wait

    - name: Start NoMachine Service
      run: |
        net start nxserver

    - name: Download Cloudflared
      run: |
        curl -L -o cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

    - name: Start Tunnel
      run: |
        ./cloudflared.exe tunnel --url tcp://localhost:4000
