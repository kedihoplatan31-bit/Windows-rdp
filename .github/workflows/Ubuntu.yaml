name: Ubuntu NoMachine + Tailscale

on:
  workflow_dispatch:

jobs:
  nx:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Update system
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies curl

    - name: Install NoMachine
      run: |
        wget https://download.nomachine.com/download/8.11/Linux/nomachine_8.11.3_1_amd64.deb
        sudo dpkg -i nomachine_8.11.3_1_amd64.deb || sudo apt -f install -y

    - name: Create user
      run: |
        sudo useradd -m user
        echo "user:user" | sudo chpasswd
        sudo usermod -aG sudo user

    - name: Set desktop
      run: |
        echo "exec startxfce4 &" | sudo tee /home/user/.xsession
        sudo chown user:user /home/user/.xsession

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Start Tailscale
      run: |
        sudo tailscaled &
        sleep 5
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --ssh=false

    - name: Show connection info
      run: |
        echo "NX USER: user"
        echo "NX PASS: user"
        echo "NX PORT: 4000"
        echo "TAILSCALE IP:"
        tailscale ip -4
        sleep infinity
