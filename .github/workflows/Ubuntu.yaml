name: Ubuntu GUI noVNC + Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Update system
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies tightvncserver novnc websockify curl

    - name: Set VNC password
      run: |
        mkdir -p ~/.vnc
        echo -e "123456\n123456\nn" | vncpasswd
        cat > ~/.vnc/xstartup << 'EOF'
        #!/bin/sh
        unset SESSION_MANAGER
        unset DBUS_SESSION_BUS_ADDRESS
        exec startxfce4 &
        EOF
        chmod +x ~/.vnc/xstartup

    - name: Start VNC
      run: |
        vncserver -kill :1 || true
        vncserver :1 -geometry 1280x720

    - name: Start noVNC
      run: |
        websockify --web=/usr/share/novnc/ 6080 localhost:5901 &
        sleep 3

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Start Tailscale
      run: |
        sudo tailscaled &
        sleep 5
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --ssh=false

    - name: Show access info
      run: |
        echo "TAILSCALE IP:"
        tailscale ip -4
        echo ""
        echo "TELEFONDAN GIRIS:"
        echo "http://TAILSCALE_IP:6080"
        sleep infinity
