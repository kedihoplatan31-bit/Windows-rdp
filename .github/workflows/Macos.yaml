name: macOS Tailscale NoMachine

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo tailscaled install-system-daemon

      - name: Start Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTHKEY }} \
            --hostname=github-macos

      - name: Install NoMachine
        run: |
          brew install --cask nomachine

      - name: Enable NoMachine
        run: |
          sudo xattr -dr com.apple.quarantine /Applications/NoMachine.app
          sudo /Applications/NoMachine.app/Contents/MacOS/nxserver.bin --start

      - name: Create User
        run: |
          sudo sysadminctl -addUser nxuser -password 123456
          sudo dseditgroup -o edit -a nxuser -t user admin

      - name: Show Tailscale IP
        run: tailscale ip -4

      - name: Keep Alive (6 saat)
        run: sleep 21600
